name: experiment-platform
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - pip
  
  # 通过pip安装的包
  - pip:
    - transformers>=4.30.0
    - datasets>=2.0.0
    - accelerate>=0.20.0
    - pandas>=1.5.0
    - numpy>=1.24.0
    - pyyaml>=6.0
    - pynvml>=11.0.0
    - psutil>=5.9.0
    - rouge-score>=0.1.2
    - sacrebleu>=2.3.0
    - tqdm>=4.64.0
    - requests>=2.28.0 