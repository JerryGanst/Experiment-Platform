# CAKE-AdaKV 统一集成框架配置模板
# 
# 使用方法：
# 1. 复制此文件为 config.yaml
# 2. 根据需求修改配置值
# 3. 使用 --config config.yaml 加载配置

# 基础配置
cache:
  total_size: 4096          # 总缓存大小（tokens）
  # 或使用 bl 参数
  # bl: 1024                # Budget Limit，会覆盖 total_size

# 性能配置
performance:
  enable_monitoring: true   # 启用性能监控
  enable_auto_tuning: true  # 启用自动调优
  warmup_samples: 5         # 预热样本数
  performance_tracking: true # 性能跟踪
  enable_fallback: true     # 启用回退机制
  memory_efficient: false   # 内存高效模式

# 实验配置
experiment:
  experiment_mode: false    # 实验模式
  detailed_logging: false   # 详细日志
  detailed_output: false    # 详细输出

# 算法配置
algorithm:
  # V指标计算方式：var, scaled_var, std, entropy
  v_metric: "var"
  
  # CAKE参数
  tau1: 0.1                 # H指标温度参数
  tau2: 0.1                 # V指标温度参数
  
  # AdaKV参数
  window_size: 32           # 窗口大小
  base_capacity: 512        # 基础容量
  kernel_size: 7            # 卷积核大小
  floor_alpha: 0.5          # 下限系数
  beta: 20                  # AdaKV的beta参数

# 策略阈值
thresholds:
  high_dispersion_threshold: 0.7  # H指标高分散阈值
  high_dynamics_threshold: 0.5    # V指标高动态阈值
  key_head_ratio: 0.2             # 关键头比例
  min_budget_ratio: 0.02          # 最小预算比例

# 合成数据配置（当不提供输入文件时使用）
synthetic:
  enabled: true             # 使用合成数据
  num_layers: 12           # 层数
  num_heads: 32            # 头数
  seq_len: 512             # 序列长度（如果设置了bl且未显式指定，会被bl覆盖）
  batch_size: 1            # 批大小

# 环境预设
# 可选值：dev, prod, custom
# - dev: 开发环境，启用所有监控和日志
# - prod: 生产环境，优化性能，关闭调试
# - custom: 自定义，使用上述配置
environment: "custom"

# 输入输出
io:
  # input: "path/to/attention_weights.npy"  # 输入文件路径
  # output: "results.json"                  # 输出文件路径 